name: Product checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: python3 scripts/check-repository.py --history
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Verify packed files against Git
        run: |
          archive=$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")
          python3 scripts/check-repository.py --archive "$RUNNER_TEMP/$archive"
